<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 110" width="100%" height="100%">
  <!-- Jumping / Celebrating Mascot Figure -->
  <g transform="translate(12, 6)">
    <!-- Blue/Purple Head -->
    <circle cx="50" cy="27" r="5.5" fill="#373199" />

    <!-- Orange Jumping Body & Arms -->
    <!-- Arm raised high -->
    <path 
      d="M 50,33 L 53,4 C 54,2 55.5,2 56,4 L 54.5,33 Z" 
      fill="#f46f14" 
    />
    <!-- Left arm stretched -->
    <path 
      d="M 47,35 C 44,32 38,34 37,38 C 36,40 39,41 41,39 L 47,38 Z" 
      fill="#f46f14" 
    />
    <!-- Torso and jumping legs -->
    <path 
      d="M 47,35 L 53,35 L 43,68 L 33,76 C 30,78 33,81 36,78 L 47,68 L 51,55 L 53,67 C 54,71 57,71 56,66 L 53,50 L 51,35 Z" 
      fill="#f46f14" 
    />

    <!-- Dynamic Blue/Purple Wave/Swoosh Underneath -->
    <path 
      d="M 6,76 C 24,76 39,78 68,69 C 45,86 24,84 6,76 Z" 
      fill="#382fa4" 
    />
  </g>

  <!-- Typography: intelli (blue) + Paat (orange) -->
  <text 
    x="94" 
    y="72" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="44" 
    font-weight="800"
    letter-spacing="-0.5"
  >
    <tspan fill="#323395">intelli</tspan><tspan fill="#f46f14">Paat</tspan>
  </text>
</svg>

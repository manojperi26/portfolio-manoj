<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="100%" height="100%">
  <defs>
    <linearGradient id="endeavourGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2279c1" />
      <stop offset="50%" stop-color="#2a5aa8" />
      <stop offset="100%" stop-color="#493892" />
    </linearGradient>
    <linearGradient id="middleTongueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#274a9f" />
      <stop offset="100%" stop-color="#3d378e" />
    </linearGradient>
  </defs>

  <!-- Left Stylized E Emblem -->
  <g transform="translate(10, 18)">
    <!-- Outer rounded frame with opening on the right -->
    <path 
      d="M 72,10 L 22,10 C 12,10 4,18 4,28 L 4,56 C 4,66 12,74 22,74 L 72,74 C 75.5,74 78,71.5 78,68 L 78,57 C 78,53.5 75.5,51 72,51 L 28,51 C 24,51 21,48 21,44 C 21,40 24,37 28,37 L 72,37 C 75.5,37 78,34.5 78,31 L 78,20 C 78,16.5 75.5,10 72,10 Z" 
      fill="url(#endeavourGrad)" 
    />
    <!-- Center Horizontal Tongue -->
    <rect 
      x="24" 
      y="37" 
      width="45" 
      height="14" 
      rx="7" 
      fill="url(#middleTongueGrad)" 
    />
  </g>

  <!-- Typography -->
  <text 
    x="100" 
    y="56" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="29" 
    font-weight="800" 
    letter-spacing="2.2" 
    fill="#2071b7"
  >ENDEAVOUR</text>

  <text 
    x="102" 
    y="84" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="16.5" 
    font-weight="400" 
    letter-spacing="5.2" 
    fill="#483c8c"
  >TECHNOLOGIES</text>
</svg>

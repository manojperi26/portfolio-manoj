<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" rx="12" fill="url(#certBg1)" />
  
  <!-- Outer border -->
  <rect x="16" y="16" width="448" height="288" rx="8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <rect x="22" y="22" width="436" height="276" rx="6" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- University badge emblem -->
  <circle cx="240" cy="70" r="30" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="2" />
  <path d="M 226 66 L 240 56 L 254 66 L 240 76 Z" fill="#10B981" />
  <path d="M 230 71 L 230 80 C 230 85 250 85 250 80 L 250 71" fill="none" stroke="#10B981" stroke-width="2" />
  <circle cx="240" cy="70" r="34" fill="none" stroke="#10B981" stroke-dasharray="2,3" />

  <!-- Issuer -->
  <text x="240" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle" letter-spacing="1">LOVELY PROFESSIONAL UNIVERSITY</text>
  
  <!-- Title -->
  <text x="240" y="152" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">AI ENGINEER LAUNCHPAD</text>
  <text x="240" y="174" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#A7F3D0" text-anchor="middle">Mastering LLMs and Agentic AI</text>

  <!-- Divider line -->
  <line x1="140" y1="195" x2="340" y2="195" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- Recipient / Date -->
  <text x="240" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Peri Naga Venkata Sai Manoj</text>
  <text x="240" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Issued: August 2026 • Verified Credential</text>

  <!-- Bottom Verification Badge -->
  <g transform="translate(190, 260)">
    <rect width="100" height="22" rx="11" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1" />
    <text x="50" y="15" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6EE7B7" text-anchor="middle">✓ VERIFIED</text>
  </g>
